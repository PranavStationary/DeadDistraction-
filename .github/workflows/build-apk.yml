name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up JDK (Java Development Kit) - Version 17 is standard for modern Android projects
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Caches gradle dependencies to speed up subsequent builds

      # 3. Grant execution permissions to the Gradle wrapper script
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # 4. Build the Debug APK using Gradle
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 5. Upload the generated APK so you can download it from the GitHub UI
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30 # Adjust how long you want to keep the artifact
