name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  STORE_PASSWORD: android
  KEY_PASSWORD: android

jobs:
  build-apk:
    name: Assemble Aegis Lock APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36.1 & Build Tools
        run: |
          set +o pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || true)
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            "$SDKMANAGER" --install "platforms;android-36.1" || true
          fi
          # If android-36.1 minor platform is not available in the public runner channel, fall back to API 36 on CI
          if [ -n "$ANDROID_HOME" ] && [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
          fi

      - name: Prepare Signing Keystores (debug.keystore & my-upload-key.jks)
        run: |
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -s "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Release,O=Android,C=US"
          fi

      - name: Prepare .env Files for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env.example" ]; then
            echo "# Placeholder .env.example" > .env.example
          fi
          cp .env.example .env
          cp .env.example app/.env
          cp .env.example app/.env.example

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Provide ./gradlew Wrapper Shim for CI Compatibility
        run: |
          if [ ! -f "./gradlew" ]; then
            printf '#!/usr/bin/env bash\nexec gradle "$@"\n' > gradlew
            chmod +x gradlew
          fi

      - name: Build Signed Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Package APK Output
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found built APK at: $APK_PATH"
          cp "$APK_PATH" Aegis-Lock.apk
          ls -lh Aegis-Lock.apk

      - name: Upload Aegis-Lock APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Lock-APK
          path: Aegis-Lock.apk
          if-no-files-found: error
          retention-days: 30
